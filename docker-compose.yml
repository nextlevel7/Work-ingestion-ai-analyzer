services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: work_intake
    ports:
      - "5432:5432"
    volumes:
      - work_intake_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d work_intake"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  work_intake_pg:
